<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元素符號對照練習｜國二理化暑假預習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --ink:#1B2A44; --soft:#5F6A7E; --rule:#E2DED5;
  --metal-bg:#F7E6DA; --metal-line:#C97A44; --metal-ink:#7A3A14;
  --non-bg:#DFEDE8; --non-line:#4A9A85; --non-ink:#134B3B;
  --meta-bg:#E9E5F1; --meta-line:#7A6EA6; --meta-ink:#3D3366;
  --inert-bg:#F2F0EA; --inert-ink:#A8A398;
  --mark:#FFE45C; --wrong:#B33A2B;
  --cell:38px; --gap:3px;
}
@media (max-width:760px){ :root{ --cell:34px; --gap:2px; } }
@media (prefers-color-scheme:dark){
  :root{
    --paper:#141924; --ink:#EDEAE2; --soft:#98A1B2; --rule:#2A3242;
    --metal-bg:#4A2B18; --metal-line:#C97A44; --metal-ink:#F3D2B6;
    --non-bg:#123A31; --non-line:#4A9A85; --non-ink:#BCE3D7;
    --meta-bg:#292441; --meta-line:#7A6EA6; --meta-ink:#CEC6E8;
    --inert-bg:#1D2431; --inert-ink:#5D677A;
    --mark:#D8B822;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif; font-size:16px; line-height:1.7;
  -webkit-text-size-adjust:100%; padding:20px 0 56px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--soft)}
h1{font-family:"Noto Serif TC",serif;font-weight:600;font-size:26px;line-height:1.35;margin:2px 0 14px}

/* progress: a highlighter stroke */
.prog{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.prog b{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px}
.prog span{font-size:13px;color:var(--soft)}
.bar{position:relative;height:12px;background:transparent;border-bottom:1.5px solid var(--rule);margin-bottom:4px}
.bar i{position:absolute;left:0;bottom:0;height:11px;width:0;background:var(--mark);
  mix-blend-mode:multiply;border-radius:2px 6px 5px 3px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.bar i.pale{opacity:.42;height:7px}
.psub{font-size:13px;color:var(--soft);min-height:22px;margin-bottom:16px}
@media (prefers-color-scheme:dark){ .bar i{mix-blend-mode:normal;opacity:.75} }

/* mode tabs */
.tabs{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:18px}
.tabs button{flex:1;min-height:46px;border:0;background:transparent;color:var(--ink);
  font-family:inherit;font-size:15px;cursor:pointer;border-right:1.5px solid var(--ink)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.tabs button:focus-visible{outline:3px solid var(--metal-line);outline-offset:-3px}

/* table */
.scroller{position:relative;margin:0 -16px 4px}
.rail{overflow-x:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(18,var(--cell));gap:var(--gap);width:max-content}
.gn{font-family:"Space Grotesk",sans-serif;font-size:11px;color:var(--soft);text-align:center;padding-bottom:3px}
.cell{position:relative;height:calc(var(--cell)*1.06);border-radius:5px;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  font-family:inherit;padding:0;background:var(--inert-bg)}
.cell .sym{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;line-height:1.1}
.cell .zh{font-size:11px;line-height:1.2;margin-top:1px}
.cell.el-x{color:var(--inert-ink)}
.cell.el-x .sym{font-weight:500;font-size:12px}
.cell.el-m{background:var(--metal-bg);border-color:var(--metal-line);color:var(--metal-ink);cursor:pointer}
.cell.el-n{background:var(--non-bg);border-color:var(--non-line);color:var(--non-ink);cursor:pointer}
.cell.el-ml{background:var(--meta-bg);border-color:var(--meta-line);color:var(--meta-ink);cursor:pointer}
.cell.el-dim{opacity:.32}
.cell.el-m:focus-visible,.cell.el-n:focus-visible,.cell.el-ml:focus-visible{outline:2px solid var(--ink);outline-offset:-1px;z-index:3}
.range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);margin:-6px 0 16px}
.range button{border:1.5px solid var(--rule);background:transparent;color:var(--soft);border-radius:20px;
  min-height:40px;padding:0 16px;font-family:inherit;font-size:14px;cursor:pointer;transition:background .15s}
.range button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.range button:focus-visible{outline:3px solid var(--metal-line);outline-offset:2px}
.cell.el-hide .zh{visibility:hidden}
.note{grid-column:1/19;margin-top:6px;border:1px dashed var(--rule);border-radius:5px;
  font-size:12px;color:var(--soft);text-align:center;padding:7px 4px}

/* highlighter swipe on mastered cells */
.cell.el-done::after{content:"";position:absolute;left:-6%;top:14%;width:112%;height:74%;
  background:var(--mark);mix-blend-mode:multiply;border-radius:45% 55% 40% 60%/60% 40% 55% 45%;
  transform:rotate(-2.5deg) scaleX(1);transform-origin:left center;pointer-events:none}
.cell.el-done.el-fresh::after{animation:swipe .5s cubic-bezier(.3,.9,.4,1)}
@keyframes swipe{from{transform:rotate(-2.5deg) scaleX(0)}to{transform:rotate(-2.5deg) scaleX(1)}}
@media (prefers-color-scheme:dark){ .cell.el-done::after{mix-blend-mode:normal;opacity:.32} }

.cell.el-half::after{content:"";position:absolute;left:5%;bottom:9%;width:90%;height:24%;
  background:var(--mark);mix-blend-mode:multiply;border-radius:45% 55% 50% 50%/60% 40% 50% 50%;
  transform:rotate(-1.5deg);pointer-events:none}
@media (prefers-color-scheme:dark){ .cell.el-half::after{mix-blend-mode:normal;opacity:.4} }
.cell.el-ask{z-index:2;animation:ask 1.1s ease-in-out infinite}
@keyframes ask{0%,100%{box-shadow:inset 0 0 0 1px var(--ink)}50%{box-shadow:inset 0 0 0 3px var(--ink)}}
.cell.el-bad{z-index:2;border-color:var(--wrong);box-shadow:inset 0 0 0 2px var(--wrong);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* panel */
.panel{border-top:1.5px solid var(--rule);margin-top:14px;padding-top:18px;min-height:190px}
.hint{color:var(--soft);font-size:14px}
.q{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.q .big{font-family:"Noto Serif TC",serif;font-weight:600;font-size:44px;line-height:1}
.q .bigsym{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:44px;line-height:1}
.q .lab{font-size:13px;color:var(--soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{min-height:58px;border:1.5px solid var(--rule);border-radius:10px;background:transparent;
  color:var(--ink);font-family:"Noto Serif TC",serif;font-weight:600;font-size:24px;cursor:pointer}
.opts button:focus-visible{outline:3px solid var(--metal-line);outline-offset:2px}
.opts button.ok{border-color:var(--non-line);background:var(--non-bg);color:var(--non-ink)}
.opts button.no{border-color:var(--wrong);color:var(--wrong)}
.fb{margin-top:14px;font-size:15px;min-height:28px}
.fb.ok{color:var(--non-ink)} .fb.no{color:var(--wrong)}
.next{margin-top:14px;min-height:48px;padding:0 22px;border:0;border-radius:10px;
  background:var(--ink);color:var(--paper);font-family:inherit;font-size:15px;cursor:pointer}

/* detail card */
.card{border:1.5px solid var(--rule);border-radius:12px;padding:16px}
.card .top{display:flex;align-items:baseline;gap:12px}
.card .s{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:38px;line-height:1}
.card .z{font-family:"Noto Serif TC",serif;font-weight:600;font-size:30px}
.card .tag{font-size:12px;border:1px solid var(--rule);border-radius:20px;padding:2px 10px;color:var(--soft)}
.card .lat{margin-top:10px;font-size:14px;color:var(--soft)}
.card .lat b{font-family:"Space Grotesk",sans-serif;color:var(--ink);font-weight:500}
.card .use{margin-top:8px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid;vertical-align:-2px;margin-right:5px}
footer{margin-top:34px;padding-top:16px;border-top:1.5px solid var(--rule);font-size:13px;color:var(--soft);
  display:flex;justify-content:space-between;align-items:center;gap:12px}
footer button{border:1.5px solid var(--rule);background:transparent;color:var(--soft);
  border-radius:8px;min-height:40px;padding:0 14px;font-family:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">國二理化 · 暑假預習</p>
  <h1>元素符號對照練習</h1>

  <div class="prog"><b id="pnum">0</b><span>／ <span id="ptot">26</span> <span id="plab">個兩種都練熟</span></span></div>
  <div class="bar"><i id="pbar2" class="pale"></i><i id="pbar"></i></div>
  <p class="psub" id="psub"></p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-browse" aria-selected="true">查元素</button>
    <button role="tab" id="t-find" aria-selected="false">找位置</button>
    <button role="tab" id="t-name" aria-selected="false">認符號</button>
  </div>

  <div class="range">練習範圍
    <button type="button" id="r1" aria-pressed="true">基礎 26</button>
    <button type="button" id="r2" aria-pressed="false">全部 52</button>
  </div>

  <div class="scroller"><div class="rail"><div class="grid" id="grid"></div></div></div>
  <div class="legend">
    <span><i style="background:var(--metal-bg);border-color:var(--metal-line)"></i>金屬 27</span>
    <span><i style="background:var(--non-bg);border-color:var(--non-line)"></i>非金屬 18</span>
    <span><i style="background:var(--meta-bg);border-color:var(--meta-line)"></i>類金屬 7</span>
    <span><i style="background:var(--inert-bg);border-color:var(--rule)"></i>不用管</span>
  </div>

  <div class="panel" id="panel"></div>

  <footer>
    <span id="stat">進度存在這支手機裡</span>
    <button id="reset">清除進度</button>
  </footer>
</div>

<script>
var MAIN = [
 ["H","氫",1,1,"n","","最輕的元素，氫氣球會往上飄"],
 ["He","氦",18,1,"n","","派對氣球灌的就是它，而且不會燃燒"],
 ["Li","鋰",1,2,"m","","手機和電動車的鋰電池"],
 ["Be","鈹",2,2,"m","","很輕又很硬，用在飛機零件。粉塵有毒"],
 ["B","硼",13,2,"ml","","硼砂；耐熱玻璃裡也有它"],
 ["C","碳",14,2,"n","","鉛筆芯和鑽石都是碳，只是排列方式不同"],
 ["N","氮",15,2,"n","","空氣中最多的氣體，約佔八成"],
 ["O","氧",16,2,"n","","呼吸靠它，約佔空氣五分之一"],
 ["F","氟",17,2,"n","","牙膏上寫的「含氟」就是它"],
 ["Ne","氖",18,2,"n","","霓虹燈的「霓」，通電會發紅光"],
 ["Na","鈉",1,3,"m","Natrium","食鹽的一半。丟進水裡會劇烈反應"],
 ["Mg","鎂",2,3,"m","","鎂帶燃燒發出刺眼白光，煙火常用"],
 ["Al","鋁",13,3,"m","","鋁箔紙、飲料罐"],
 ["Si","矽",14,3,"ml","","沙子的主成分，也是晶片的材料"],
 ["P","磷",15,3,"n","","火柴頭和骨骼裡都有"],
 ["S","硫",16,3,"n","","溫泉的臭味來源"],
 ["Cl","氯",17,3,"n","","游泳池消毒用。也是食鹽的另一半"],
 ["Ar","氬",18,3,"n","","很懶不跟人反應，焊接時用來隔絕空氣"],
 ["K","鉀",1,4,"m","Kalium","香蕉裡含量很高"],
 ["Ca","鈣",2,4,"m","","牛奶和骨頭的主角"],
 ["Mn","錳",7,4,"m","","乾電池裡的二氧化錳；高錳酸鉀是紫色的"],
 ["Fe","鐵",8,4,"m","Ferrum","血紅素帶氧靠它，生鏽的也是它"],
 ["Co","鈷",9,4,"m","","鈷藍色顏料；鋰電池正極也用它"],
 ["Ni","鎳",10,4,"m","","五元硬幣、不鏽鋼的成分"],
 ["Cu","銅",11,4,"m","Cuprum","電線和十元硬幣"],
 ["Zn","鋅",12,4,"m","","鍍鋅鐵皮防鏽，乾電池也用它"],
 ["Ga","鎵",13,4,"m","","熔點只有 30 度，握在手心會融化"],
 ["Ge","鍺",14,4,"ml","","早期電晶體的材料，後來被矽取代"],
 ["As","砷",15,4,"ml","","砒霜的主成分，劇毒"],
 ["Se","硒",16,4,"n","","人體必需的微量元素，堅果裡有"],
 ["Br","溴",17,4,"n","","室溫下唯一的液態非金屬，紅棕色"],
 ["Kr","氪",18,4,"n","","惰性氣體，用在高亮度燈泡"],
 ["Rb","銣",1,5,"m","","鹼金屬，比鉀還要活潑"],
 ["Sr","鍶",2,5,"m","","煙火的紅色來自它"],
 ["Ag","銀",11,5,"m","Argentum","導電性最好的金屬"],
 ["Cd","鎘",12,5,"m","","鎘米污染的鎘，會累積在腎臟。有毒"],
 ["In","銦",13,5,"m","","觸控螢幕的透明導電層用它"],
 ["Sn","錫",14,5,"m","Stannum","焊錫、馬口鐵罐頭"],
 ["Sb","銻",15,5,"ml","","防火材料；古代拿來畫眼線"],
 ["Te","碲",16,5,"ml","","太陽能板的材料之一"],
 ["I","碘",17,5,"n","","優碘藥水；海帶裡很多"],
 ["Xe","氙",18,5,"n","","汽車的氙氣頭燈"],
 ["Cs","銫",1,6,"m","","銫原子鐘定義了「一秒」有多長"],
 ["Ba","鋇",2,6,"m","","照胃部 X 光前喝的鋇劑；煙火的綠色"],
 ["Au","金",11,6,"m","Aurum","幾乎不生鏽，所以自古珍貴"],
 ["Hg","汞",12,6,"m","Hydrargyrum","唯一在室溫是液體的金屬"],
 ["Tl","鉈",13,6,"m","","劇毒，曾出現在毒殺案件中"],
 ["Pb","鉛",14,6,"m","Plumbum","密度大很重，早期水管用它"],
 ["Bi","鉍",15,6,"m","","胃藥成分；結晶會呈現彩虹色"],
 ["Po","釙",16,6,"ml","","居禮夫人發現的，有放射性"],
 ["At","砈",17,6,"n","","極稀有的鹵素，有放射性"],
 ["Rn","氡",18,6,"n","","從地下滲出的放射性氣體，室內要通風"]
];
var CORE=" H He C N O F Ne Na Mg Al Si P S Cl Ar K Ca Fe Cu Zn Ag Sn I Au Hg Pb ";
var GRAY = "Sc3.4 Ti4.4 V5.4 Cr6.4 Y3.5 Zr4.5 Nb5.5 Mo6.5 Tc7.5 Ru8.5 Rh9.5 Pd10.5 La3.6 Hf4.6 Ta5.6 W6.6 Re7.6 Os8.6 Ir9.6 Pt10.6";

var KEY="elem-practice-v2", GOAL=2, mode="browse", range=1, target=null, locked=false, cells={};
var store={find:{},name:{}};
try{ var raw=JSON.parse(localStorage.getItem(KEY)); if(raw&&raw.find&&raw.name) store=raw }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)) }catch(e){} }
function sc(m,s){ return store[m][s]||0 }
function got(m,s){ return sc(m,s)>=GOAL }
function tally(m){ var n=0; MAIN.forEach(function(e){ if(inRange(e)&&got(m,e[0])) n++ }); return n }

var grid=document.getElementById("grid"), panel=document.getElementById("panel");
for(var g=1;g<=18;g++){ var h=document.createElement("div"); h.className="gn"; h.textContent=g;
  h.style.gridColumn=g; h.style.gridRow=1; grid.appendChild(h); }

GRAY.split(" ").forEach(function(t){
  var m=t.match(/^([A-Z][a-z]?)(\d+)\.(\d+)$/); if(!m) return;
  var d=document.createElement("div"); d.className="cell el-x";
  d.innerHTML='<span class="sym">'+m[1]+'</span>';
  d.style.gridColumn=m[2]; d.style.gridRow=+m[3]+1; d.setAttribute("aria-hidden","true");
  grid.appendChild(d);
});

MAIN.forEach(function(e){
  var b=document.createElement("button"); b.type="button"; b.className="cell el-"+e[4];
  b.innerHTML='<span class="sym">'+e[0]+'</span><span class="zh">'+e[1]+'</span>';
  b.style.gridColumn=e[2]; b.style.gridRow=e[3]+1;
  b.setAttribute("aria-label",e[0]+" "+e[1]);
  b.onclick=function(){ tap(e,b) };
  cells[e[0]]=b; grid.appendChild(b);
});
var nb=document.createElement("div"); nb.className="note";
nb.textContent="第七週期與鑭系、錒系：放射性或人造元素，國中階段用不到";
grid.appendChild(nb);

function inRange(e){ return range===2 || CORE.indexOf(" "+e[0]+" ")>=0 }
function refresh(){
  var practice = mode!=="browse", n=0, t=0, h=0;
  MAIN.forEach(function(e){
    var c=cells[e[0]], r=inRange(e), d, half;
    if(practice){ var v=sc(mode,e[0]); d=v>=GOAL; half=(v===1); }
    else { var a=got("find",e[0]), b=got("name",e[0]); d=a&&b; half=(a||b)&&!d; }
    if(r){ t++; if(d) n++; else if(half) h++; }
    c.classList.toggle("el-done",d);
    c.classList.toggle("el-half",half&&!d);
    c.classList.toggle("el-hide",practice);
    c.classList.toggle("el-dim",!r);
  });
  document.getElementById("pnum").textContent=n;
  document.getElementById("ptot").textContent=t;
  document.getElementById("plab").textContent=practice?(mode==="find"?"個練熟 · 找位置":"個練熟 · 認符號"):"個兩種都練熟";
  document.getElementById("pbar").style.width=(t?n/t*100:0)+"%";
  document.getElementById("pbar2").style.width=(t?(n+h)/t*100:0)+"%";
  document.getElementById("psub").textContent = practice
    ? (t&&n>=t ? "這個範圍已全部練熟，接下來是隨機複習"
              : (h?"另有 "+h+" 個在這個模式答對過一次，再對一次就算練熟":""))
    : ("找位置 "+tally("find")+"／"+t+"　　認符號 "+tally("name")+"／"+t);
}
function clearMarks(){ MAIN.forEach(function(e){ cells[e[0]].classList.remove("el-ask","el-bad") }); }

function pick(){
  var live=MAIN.filter(inRange);
  var todo=live.filter(function(e){ return sc(mode,e[0])<GOAL });
  var src=todo.length?todo:live;                      // 全部練熟後轉為隨機複習
  var pool=[];
  src.forEach(function(e){ var w=sc(mode,e[0])===1?3:1;   // 半熟的優先回鍋
    for(var i=0;i<w;i++) pool.push(e) });
  var n; do{ n=pool[Math.floor(Math.random()*pool.length)] }
  while(src.length>1&&target&&n[0]===target[0]);
  return n;
}
function decoys(e){
  var live=MAIN.filter(inRange);
  var same=live.filter(function(o){ return o[0]!==e[0] && o[0][0]===e[0][0] });
  var rest=live.filter(function(o){ return o[0]!==e[0] && o[0][0]!==e[0][0] && o[4]===e[4] });
  rest.sort(function(){ return Math.random()-.5 });
  var fill=live.filter(function(o){ return o[0]!==e[0] && o[4]!==e[4] });
  fill.sort(function(){ return Math.random()-.5 });
  var out=same.concat(rest).concat(fill).slice(0,3);
  return out.concat([e]).sort(function(){ return Math.random()-.5 });
}
function award(e,ok){
  var st=store[mode], was=(st[e[0]]||0)>=GOAL;
  if(ok){ st[e[0]]=Math.min(GOAL,(st[e[0]]||0)+1);
    if(!was&&st[e[0]]>=GOAL){ var c=cells[e[0]]; c.classList.add("el-fresh"); setTimeout(function(){c.classList.remove("el-fresh")},600); } }
  else st[e[0]]=Math.max(0,(st[e[0]]||0)-1);
  save(); refresh();
}
function tap(e,b){
  if(mode!=="find"||locked) { if(mode==="browse") showCard(e); return; }
  locked=true;
  if(e[0]===target[0]){ award(e,true); b.classList.remove("el-hide");
    fb("答對了。"+target[1]+" 的符號是 "+target[0],true); }
  else{ award(target,false); b.classList.add("el-bad"); cells[target[0]].classList.add("el-ask");
    cells[target[0]].classList.remove("el-hide");
    fb("那是 "+e[0]+" "+e[1]+"。"+target[1]+" 在閃爍的那一格，符號 "+target[0],false); }
  nextBtn();
}
function fb(t,ok){ var d=document.getElementById("fb"); if(d){ d.textContent=t; d.className="fb "+(ok?"ok":"no") } }
function nextBtn(){ var p=document.getElementById("act"); if(p) p.innerHTML='<button class="next" onclick="ask()">下一題</button>'; }

function setMode(m){
  mode=m; target=null; locked=false; clearMarks();
  ["browse","find","name"].forEach(function(k){
    document.getElementById("t-"+k).setAttribute("aria-selected", String(k===m)); });
  if(m==="browse"){ panel.innerHTML='<p class="hint">點週期表上任何一個彩色格子，看它的中文、字源和生活用途。練習時，範圍外的元素會變淡但仍可點選——點錯了會告訴你那是誰。</p>'; refresh(); }
  else ask();
}
function showCard(e){
  if(mode!=="browse") return;
  panel.innerHTML='<div class="card"><div class="top"><span class="s">'+e[0]+'</span><span class="z">'+e[1]+
   '</span><span class="tag">'+(e[4]==="m"?"金屬":e[4]==="ml"?"類金屬":"非金屬")+'</span></div>'+
   (e[5]?'<p class="lat">符號來自拉丁文 <b>'+e[5]+'</b>，不是中文名的音譯，要特別記</p>':'')+
   '<p class="use">'+e[6]+'</p></div>';
}
function ask(){
  locked=false; clearMarks(); target=pick(); refresh();
  if(mode==="find"){
    panel.innerHTML='<div class="q"><span class="big">'+target[1]+'</span>'+
      '<span class="lab">在週期表上找到它<br>可左右滑動表格</span></div>'+
      '<div class="fb" id="fb"></div><div id="act"></div>';
  }else{
    cells[target[0]].classList.add("el-ask");
    var o=decoys(target), h='';
    o.forEach(function(x){ h+='<button type="button" data-s="'+x[0]+'">'+x[1]+'</button>' });
    panel.innerHTML='<div class="q"><span class="bigsym">'+target[0]+'</span>'+
      '<span class="lab">閃爍那一格是什麼元素？</span></div><div class="opts">'+h+
      '</div><div class="fb" id="fb"></div><div id="act"></div>';
    Array.prototype.forEach.call(panel.querySelectorAll(".opts button"),function(b){
      b.onclick=function(){
        if(locked) return; locked=true;
        var ok=b.dataset.s===target[0];
        if(ok){ b.className="ok"; award(target,true); fb("答對了",true); }
        else{ b.className="no"; award(target,false);
          panel.querySelector('[data-s="'+target[0]+'"]').className="ok";
          fb(target[0]+" 是 "+target[1]+"。"+target[6],false); }
        cells[target[0]].classList.remove("el-hide");
        nextBtn();
      };
    });
  }
}
function setRange(r){
  range=r; target=null; locked=false; clearMarks();
  document.getElementById("r1").setAttribute("aria-pressed",String(r===1));
  document.getElementById("r2").setAttribute("aria-pressed",String(r===2));
  if(mode==="browse") refresh(); else ask();
}
document.getElementById("r1").onclick=function(){setRange(1)};
document.getElementById("r2").onclick=function(){setRange(2)};
document.getElementById("t-browse").onclick=function(){setMode("browse")};
document.getElementById("t-find").onclick=function(){setMode("find")};
document.getElementById("t-name").onclick=function(){setMode("name")};
document.getElementById("reset").onclick=function(){
  if(!confirm("清除兩個模式的全部練習進度？")) return;
  store={find:{},name:{}}; save(); if(mode==="browse") refresh(); else ask(); refresh();
};
setMode("browse");
</script>
</body>
</html>
